stages:
  - preview
  - production

deploy_preview:
  stage: preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image: alpine:latest
  script:
    - apk add --no-cache jq curl
    - echo "🪄 Creating DBLab branch for MR $CI_MERGE_REQUEST_IID"
    - BRANCH_NAME="pr-${CI_MERGE_REQUEST_IID}"
    - CLONE_ID="pr_${CI_MERGE_REQUEST_IID}_clone"
    - |
      curl -X POST "$DBLAB_API/branch" \
        -H "Verification-Token: $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"branchName\": \"$BRANCH_NAME\", \"baseBranch\": \"main\"}"

    - echo "📦 Creating clone for $BRANCH_NAME"

    - |
      curl -X POST "$DBLAB_API/clone" \
        -H "Verification-Token: $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"id\": \"${BRANCH_NAME}_clone\",
          \"branch\": \"${BRANCH_NAME}\",
          \"db\": {
            \"username\": \"${DBLAB_DB_USERNAME}\",
            \"password\": \"${DBLAB_DB_PASSWORD}\"
          }
        }"

    - echo "⏳ Waiting for clone $CLONE_ID to be ready"
    - |
      for i in {1..30}; do
        STATUS=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID" | jq -r '.status.code')
        echo "[$i] Status: $STATUS"
        if [ "$STATUS" == "OK" ]; then break; fi
        sleep 5
      done

    - echo "🔐 Fetching connection string"
    - |
      DB_URL=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID" | jq -r '.connection_string')
      echo "DB_URL=$DB_URL"

    - echo "🚀 Triggering Dokploy deployment"
    - |
      curl -s -X POST "$DOKPLOY_API" \
        -H "Verification-Token: $DOKPLOY_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
              "project": "prompt-manager-preview",
              "ref": "'"$CI_COMMIT_REF_NAME"'",
              "environment": "preview",
              "variables": {
                "DATABASE_URL": "'"$DB_URL"'"
              }
            }'

deploy_prod:
  stage: production
  only:
    - tags
  image: curlimages/curl:latest
  script:
    - echo "🚀 Deploying production tag $CI_COMMIT_TAG"
    - |
      curl -s -X POST "$DOKPLOY_API" \
        -H "Verification-Token: $DOKPLOY_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
              "project": "prompt-manager",
              "ref": "'"$CI_COMMIT_TAG"'",
              "environment": "production",
              "variables": {
                "DATABASE_URL": "'"$PROD_DATABASE_URL"'"
              }
            }'
