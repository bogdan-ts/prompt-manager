stages:
  - preview

deploy_preview:
  stage: preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image: alpine:latest
  script:
    - apk add --no-cache jq curl
    - echo "🪄 Creating DBLab branch for MR $CI_MERGE_REQUEST_IID"
    - BRANCH_NAME="pr-${CI_MERGE_REQUEST_IID}"
    - CLONE_ID="pr_${CI_MERGE_REQUEST_IID}_clone"

    # Create DBLab branch
    - |
      curl -s -X POST "$DBLAB_API/branch" \
        -H "Verification-Token: $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"branchName\": \"$BRANCH_NAME\", \"baseBranch\": \"main\"}"

    # Create DBLab clone
    - |
      curl -s -X POST "$DBLAB_API/clone" \
        -H "Verification-Token: $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"id\": \"$CLONE_ID\",
          \"branch\": \"$BRANCH_NAME\",
          \"db\": {
            \"username\": \"$DBLAB_DB_USERNAME\",
            \"password\": \"$DBLAB_DB_PASSWORD\"
          }
        }"

    # Wait for readiness
    - |
      for i in $(seq 1 30); do
        STATUS=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID" | jq -r '.status.code')
        echo "[$i] Status: $STATUS"
        if [ "$STATUS" = "OK" ]; then break; fi
        sleep 5
      done

    # Get DB URL
    - |
      DB_URL=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID" | jq -r '.connection_string')
      echo "DB_URL=$DB_URL"

    # Set NEXTAUTH_URL based on MR ID
    - NEXTAUTH_URL="https://${CI_MERGE_REQUEST_IID}.demo-dblab.tsechoev.dev"
    - echo "NEXTAUTH_URL=$NEXTAUTH_URL"

    # Update envs in Coolify
    - |
      curl -s -X PATCH "https://app.coolify.io/api/v1/applications/$COOLIFY_APP_UUID/envs/bulk" \
        -H "Authorization: Bearer $COOLIFY_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
          "data": [
            {
              "key": "DATABASE_URL",
              "value": "'"$DB_URL"'",
              "is_preview": true,
              "is_build_time": true,
              "is_literal": true,
              "is_multiline": false,
              "is_shown_once": false
            },
            {
              "key": "NEXTAUTH_URL",
              "value": "'"$NEXTAUTH_URL"'",
              "is_preview": true,
              "is_build_time": true,
              "is_literal": true,
              "is_multiline": false,
              "is_shown_once": false
            }
          ]
        }'

    # Trigger deployment
    - |
      curl -s -X POST "https://app.coolify.io/api/v1/deploy?pr=$CI_MERGE_REQUEST_IID&force=true" \
        -H "Authorization: Bearer $COOLIFY_TOKEN"
