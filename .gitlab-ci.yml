stages:
  - preview

deploy_preview:
  stage: preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image: alpine:latest
  script:
    - apk add --no-cache jq curl

    - echo "🪄 Creating DBLab branch for MR $CI_MERGE_REQUEST_IID"
    - BRANCH_NAME="pr-${CI_MERGE_REQUEST_IID}"
    - CLONE_ID="pr_${CI_MERGE_REQUEST_IID}_clone"

    # Create DBLab branch
    - |
      curl -s -X POST "$DBLAB_API/branch" \
        -H "Verification-Token: $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"branchName\": \"$BRANCH_NAME\", \"baseBranch\": \"main\"}"

    # Create DBLab clone
    - |
      curl -s -X POST "$DBLAB_API/clone" \
        -H "Verification-Token: $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
              \"id\": \"$CLONE_ID\",
              \"branch\": \"$BRANCH_NAME\",
              \"db\": {
                \"username\": \"$DBLAB_DB_USERNAME\",
                \"password\": \"$DBLAB_DB_PASSWORD\"
              }
            }"

    # Wait for readiness
    - |
      for i in $(seq 1 30); do
        STATUS=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID" | jq -r '.status.code')
        echo "[$i] Status: $STATUS"
        if [ "$STATUS" = "OK" ]; then break; fi
        sleep 5
      done

    # Manually build DATABASE_URL
    - |
      DB_INFO=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID")
      DB_PORT=$(echo "$DB_INFO" | jq -r '.db.port')
      DB_HOST="$DBLAB_HOST"
      DB_USER="$DBLAB_DB_USERNAME"
      DB_PASS="$DBLAB_DB_PASSWORD"
      DB_NAME="$DBLAB_DB_NAME"
      DB_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
      echo "DB_URL=$DB_URL"

    # Set NEXTAUTH_URL
    - NEXTAUTH_URL="https://${CI_MERGE_REQUEST_IID}.demo-dblab.tsechoev.dev"
    - echo "NEXTAUTH_URL=$NEXTAUTH_URL"

    # Update envs in Coolify (bulk)
    - |
      curl -s -X PATCH "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs/bulk" \
        -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{
              "data": [
                {
                  "key": "DATABASE_URL",
                  "value": "'"${DB_URL}"'",
                  "is_preview": true,
                  "is_build_time": true,
                  "is_literal": true,
                  "is_multiline": false,
                  "is_shown_once": false
                },
                {
                  "key": "NEXTAUTH_URL",
                  "value": "'"${NEXTAUTH_URL}"'",
                  "is_preview": true,
                  "is_build_time": true,
                  "is_literal": true,
                  "is_multiline": false,
                  "is_shown_once": false
                }
              ]
            }'

    # Trigger preview deployment
    - |
      curl -s -X POST "${COOLIFY_URL}/api/v1/deploy" \
        -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{
              "uuid": "'"${COOLIFY_APP_UUID}"'",
              "pr": '"${CI_MERGE_REQUEST_IID}"',
              "force": true
            }'

cleanup_preview:
  stage: preview
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
      when: always
  script:
    - apk add --no-cache curl jq
    - |
      echo "🧹 Looking for merged MR to cleanup..."

      # Extract MR number from commit message (format: "Merge branch 'feature' into 'main'")
      MR_ID=$(echo "$CI_COMMIT_MESSAGE" | sed -n 's/.*See merge request.*!\([0-9]\+\).*/\1/p' || echo "")

      # Fallback: get MR from GitLab API
      if [ -z "$MR_ID" ]; then
        echo "Trying to detect MR via API..."
        MR_RESPONSE=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests")
        MR_ID=$(echo "$MR_RESPONSE" | jq -r '.[0].iid // empty')
      fi

      if [ -z "$MR_ID" ] || [ "$MR_ID" = "null" ]; then
        echo "ℹ️ No MR detected, skipping cleanup"
        exit 0
      fi

      echo "🎯 Found MR $MR_ID, cleaning up resources..."
      BRANCH_NAME="pr-${MR_ID}"
      CLONE_ID="pr_${MR_ID}_clone"

      # Check if resources exist before attempting deletion
      CLONE_EXISTS=$(curl -s -H "Verification-Token: $DBLAB_TOKEN" "$DBLAB_API/clone/$CLONE_ID" | jq -r '.status.code // empty')

            if [ "$CLONE_EXISTS" != "null" ] && [ -n "$CLONE_EXISTS" ]; then
        echo "🗑️ Deleting DBLab clone: $CLONE_ID"
        curl -s -X DELETE "$DBLAB_API/clone/$CLONE_ID" \
          -H "Verification-Token: $DBLAB_TOKEN"
        echo "✅ Clone deleted"
        
        echo "⏱️ Waiting 10 seconds for clone cleanup to complete..."
        sleep 10
      else
        echo "ℹ️ Clone $CLONE_ID not found or already deleted"
      fi

      echo "🗑️ Deleting DBLab branch: $BRANCH_NAME"
      BRANCH_DELETE_RESPONSE=$(curl -s -X DELETE "$DBLAB_API/branch/$BRANCH_NAME" \
        -H "Verification-Token: $DBLAB_TOKEN")

      if echo "$BRANCH_DELETE_RESPONSE" | grep -q "BAD_REQUEST"; then
        echo "⚠️ Branch still has dependencies, retrying in 5 seconds..."
        sleep 5
        curl -s -X DELETE "$DBLAB_API/branch/$BRANCH_NAME" \
          -H "Verification-Token: $DBLAB_TOKEN"
      fi
      echo "✅ Branch deletion completed"

      echo "🎉 Cleanup completed for MR $MR_ID"
