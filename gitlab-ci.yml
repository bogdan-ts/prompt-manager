stages:
  - preview
  - production

variables:
  DBLAB_API: https://your-dblab-host/api/v1
  DOKPLOY_API: https://dokploy.tsechoev.dev/api/deploy
  DOKPLOY_PROJECT: prompt-manager-preview

# Preview for merge requests
deploy_preview:
  stage: preview
  only:
    - merge_requests
  script:
    - echo "🔧 Creating DBLab clone for branch $CI_COMMIT_REF_NAME"

    - |
      CLONE_ID="mr_${CI_MERGE_REQUEST_IID}_clone"

      curl -s -X POST "$DBLAB_API/clones" \
        -H "Authorization: Bearer $DBLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
              "id": "'"$CLONE_ID"'",
              "branch": "'"$CI_COMMIT_REF_NAME"'",
              "db": {
                "username": "'"$DBLAB_DB_USERNAME"'",
                "password": "'"$DBLAB_DB_PASSWORD"'"
              }
            }'

    - echo "⏳ Waiting for clone..."

    - |
      for i in {1..20}; do
        STATUS=$(curl -s -H "Authorization: Bearer $DBLAB_TOKEN" "$DBLAB_API/clones/$CLONE_ID" | jq -r '.status.code')
        echo "Status: $STATUS"
        if [ "$STATUS" == "OK" ]; then break; fi
        sleep 5
      done

    - echo "🔐 Fetching clone DB URL..."

    - |
      DB_URL=$(curl -s -H "Authorization: Bearer $DBLAB_TOKEN" "$DBLAB_API/clones/$CLONE_ID" | jq -r '.connection_string')
      echo "Got DB URL: $DB_URL"

    - echo "🚀 Deploying to Dokploy (preview)..."

    - |
      curl -s -X POST "$DOKPLOY_API" \
        -H "Authorization: Bearer $DOKPLOY_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
          "project": "'"$DOKPLOY_PROJECT"'",
          "ref": "'"$CI_COMMIT_REF_NAME"'",
          "environment": "preview",
          "variables": {
            "DATABASE_URL": "'"$DB_URL"'"
          }
        }'

# 🚀 Production deploy on tag
deploy_prod:
  stage: production
  only:
    - tags
  script:
    - echo "🚀 Deploying to production (tag: $CI_COMMIT_TAG)..."

    - |
      curl -s -X POST "$DOKPLOY_API" \
        -H "Authorization: Bearer $DOKPLOY_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
          "project": "'"$DOKPLOY_PROJECT"'",
          "ref": "'"$CI_COMMIT_TAG"'",
          "environment": "production",
          "variables": {
            "DATABASE_URL": "'"$PROD_DATABASE_URL"'"
          }
        }'
